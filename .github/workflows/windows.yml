name: Vocalia 0.0.4 build and release checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Vocalia-Windows-source.zip'
permissions:
  contents: read
concurrency:
  group: vocalia-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract release source
        shell: pwsh
        run: Expand-Archive Vocalia-Windows-source.zip -DestinationPath build-source
      - name: Test six languages, history, OPUS, comparison and speaker grouping in the packaged app
        shell: pwsh
        run: ./build-source/Vocalia-Windows/build.ps1
      - name: Test installer, shortcuts, reinstall and data-preserving uninstall
        shell: pwsh
        run: ./build-source/Vocalia-Windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Vocalia-0.0.4-Windows-x64
          path: |
            build-source/Vocalia-Windows/Vocalia-0.0.4-Windows-x64.zip
            build-source/Vocalia-Windows/SHA256SUMS-Windows.txt
            build-source/Vocalia-Windows/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vocalia-0.0.4-Windows-x64
          path: release
      - name: Verify and assemble both platform downloads
        shell: bash
        run: |
          sha256sum -c SHA256SUMS-Mac.txt
          sed 's/\r$//' release/SHA256SUMS-Windows.txt | (cd release && sha256sum -c -)
          sed 's/\r$//' release/release/SHA256SUMS-Installer.txt | (cd release/release && sha256sum -c -)
          mv release/release/* release/
          rmdir release/release
          cp Vocalia-0.0.4-macOS-AppleSilicon.zip Vocalia-0.0.4-source.zip release/
          mv release/Windows-Installer-Validation.txt release/Windows-0.0.4-Validation.txt
          cd release
          sha256sum Vocalia-0.0.4-*.zip Vocalia-0.0.4-*.exe > SHA256SUMS-0.0.4.txt
      - name: Publish 0.0.4 only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create v0.0.4 --target "$GITHUB_SHA" --title "Vocalia 0.0.4 — Preview" --notes-file RELEASE-0.0.4.md --prerelease --latest=false release/Vocalia-0.0.4-*.zip release/Vocalia-0.0.4-*.exe release/SHA256SUMS-0.0.4.txt release/Windows-0.0.4-Validation.txt
          for tag in v1.0.0 v1.0.1 v1.0.2 v1.0.3 v1.0.4; do
            gh release edit "$tag" --prerelease --latest=false
          done
