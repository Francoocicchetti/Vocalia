name: Vocalia 1.0.1 startup and tour fix checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Vocalia-Windows-source.zip'
permissions:
  contents: read
concurrency:
  group: vocalia-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract release source
        shell: pwsh
        run: Expand-Archive Vocalia-Windows-source.zip -DestinationPath build-source
      - name: Build and test coach marks, OPUS import and transcription through the actual GUI
        shell: pwsh
        run: ./build-source/Vocalia-Windows/build.ps1
      - name: Build and test installer, shortcuts, reinstall and data-preserving uninstall
        shell: pwsh
        run: ./build-source/Vocalia-Windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Vocalia-1.0.1-Windows-x64
          path: |
            build-source/Vocalia-Windows/Vocalia-1.0.1-Windows-x64-GuideFix.zip
            build-source/Vocalia-Windows/SHA256SUMS-Windows.txt
            build-source/Vocalia-Windows/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vocalia-1.0.1-Windows-x64
          path: release
      - name: Verify and assemble both platform downloads
        shell: bash
        run: |
          sha256sum -c SHA256SUMS-Mac.txt
          sed 's/\r$//' release/SHA256SUMS-Windows.txt | (cd release && sha256sum -c -)
          sed 's/\r$//' release/release/SHA256SUMS-Installer.txt | (cd release/release && sha256sum -c -)
          mv release/release/* release/
          rmdir release/release
          cp Vocalia-1.0.1-macOS-AppleSilicon-GuideFix.zip Vocalia-1.0.1-GuideFix-source.zip release/
          mv release/Windows-Installer-Validation.txt release/Windows-GuideFix-Validation.txt
          cd release
          sha256sum Vocalia-1.0.1-*.zip Vocalia-1.0.1-*.exe > SHA256SUMS-GuideFix.txt
      - name: Add interactive-tour downloads to 1.0.1 after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view v1.0.1
          gh release upload v1.0.1 release/Vocalia-1.0.1-*.zip release/Vocalia-1.0.1-*.exe release/SHA256SUMS-GuideFix.txt release/Windows-GuideFix-Validation.txt
