name: Vocalia 0.0.6 build and release checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.swift'
      - 'Info.plist'
      - 'build.sh'
      - 'tools/**'
      - 'ui-translations.json'
      - 'Vocalia-Windows/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: vocalia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and package Windows
        shell: pwsh
        run: ./Vocalia-Windows/build.ps1
      - name: Verify installer and upgrade preserving user data
        shell: pwsh
        run: ./Vocalia-Windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-0.0.6
          path: |
            Vocalia-Windows/Vocalia-0.0.6-Windows-x64.zip
            Vocalia-Windows/release/*.exe
            Vocalia-Windows/release/Windows-Installer-Validation.txt
          if-no-files-found: error
  mac:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build signed Mac package and test audio, history and updater
        run: zsh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-0.0.6
          path: dist/Vocalia-0.0.6-macOS-AppleSilicon.zip
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-0.0.6
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: Mac-0.0.6
          path: release/mac
      - name: Assemble tested packages and exact source
        run: |
          mkdir -p release/final
          find release/windows release/mac -type f -exec cp {} release/final/ \;
          python3 tools/package_source.py release/final/Vocalia-0.0.6-source.zip
          cd release/final
          sha256sum *.zip *.exe > SHA256SUMS-0.0.6.txt
      - name: Publish preview after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.0.6 --target "$GITHUB_SHA" --title "Vocalia 0.0.6 — Preview · Audio review" --notes-file RELEASE-0.0.6.md --prerelease --latest=false release/final/*
