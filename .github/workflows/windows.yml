name: Vocalia 1.0 release checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Vocalia-Windows-source.zip'
permissions:
  contents: read
concurrency:
  group: vocalia-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract release source
        shell: pwsh
        run: Expand-Archive Vocalia-Windows-source.zip -DestinationPath build-source
      - name: Build and test Windows executable
        shell: pwsh
        run: ./build-source/Vocalia-Windows/build.ps1
      - name: Save tested Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Vocalia-1.0-Windows-x64
          path: |
            build-source/Vocalia-Windows/Vocalia-1.0-Windows-x64.zip
            build-source/Vocalia-Windows/SHA256SUMS-Windows.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vocalia-1.0-Windows-x64
          path: release
      - name: Verify and assemble both platform downloads
        shell: bash
        run: |
          sha256sum -c SHA256SUMS-Mac.txt
          sed 's/\r$//' release/SHA256SUMS-Windows.txt | (cd release && sha256sum -c -)
          cp Vocalia-1.0-macOS-AppleSilicon.zip DOWNLOAD-INSTRUCTIONS.txt release/
          cd release
          sha256sum Vocalia-1.0-*.zip > SHA256SUMS.txt
      - name: Publish Vocalia 1.0 after all assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          state=$(gh release view v1.0.0 --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo 'Version 1.0 is already published; use a new version for future changes.'
            exit 1
          fi
          if [ "$state" = missing ]; then
            gh release create v1.0.0 --target "$GITHUB_SHA" --draft --title 'Vocalia 1.0 — Download for Mac and Windows' --notes-file RELEASE-1.0.md
          fi
          gh release upload v1.0.0 release/Vocalia-1.0-*.zip release/SHA256SUMS.txt release/DOWNLOAD-INSTRUCTIONS.txt --clobber
          gh release edit v1.0.0 --draft=false --latest
